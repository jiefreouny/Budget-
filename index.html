<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Budget Planner</title>
    
    <!-- Google Fonts: Noto Sans Thai -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Tailwind Config for Custom Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'honeydew': '#F6FFEA',
                        'soft-peach': '#FFDE96',
                        'coral-glow': '#FA855A',
                        'tomato-jam': '#C93638',
                        'sky-blue': '#62C4DA',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans Thai"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Global Styles & Variables */
        :root {
            --bg-main: #F6FFEA;
            --color-peach: #FFDE96;
            --color-coral: #FA855A;
            --color-tomato: #C93638;
            --color-sky: #62C4DA;
        }

        body {
            /* พื้นหลังหลัก (Main Background) ไล่สีแบบ Mesh Gradient ตามภาพตัวอย่างเป๊ะๆ */
            background: 
                radial-gradient(circle at 100% 0%, rgba(255, 222, 150, 0.9) 0%, transparent 60%),  /* Soft Peach มุมขวาบน */
                radial-gradient(circle at 0% 100%, rgba(98, 196, 218, 0.8) 0%, transparent 60%),   /* Sky Blue มุมซ้ายล่าง */
                radial-gradient(circle at 100% 100%, rgba(250, 133, 90, 0.3) 0%, transparent 70%), /* Coral Glow บางๆ มุมขวาล่าง */
                var(--bg-main); /* Honeydew เป็นสีฐานทั้งหมด */
            background-attachment: fixed;
            background-size: 100% 100%;
            color: var(--color-tomato);
            overflow-x: hidden;
        }

        /* --- บังคับใช้เฉพาะ 5 สี ตามคำสั่ง (Overriding Tailwind Grays/Whites/Blacks) --- */
        .text-gray-400, .text-gray-500, .text-gray-600, .text-gray-700, .text-gray-800 {
            color: var(--color-tomato) !important;
        }
        .text-gray-400, .text-gray-500 {
            opacity: 0.6; /* ใช้ความโปร่งแสงแทนการใช้สีเทา */
        }
        .bg-white, .bg-white\/50, .bg-white\/40, .bg-white\/90, .bg-gray-50 {
            background-color: rgba(246, 255, 234, 0.5) !important; /* Honeydew โปร่งแสงแทนสีขาว */
        }
        .border-gray-100, .border-gray-200, .border-gray-300, .divide-gray-100\/50 {
            border-color: rgba(255, 222, 150, 0.5) !important; /* Soft Peach โปร่งแสงแทนเส้นสีเทา */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        /* --- Animations สำหรับตัวละครและของตกแต่ง --- */
        @keyframes float-cute {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        @keyframes sway-cute {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        @keyframes blink-eyes {
            0%, 94%, 98%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.1); }
        }
        @keyframes pop-in {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .anim-float { animation: float-cute 4s ease-in-out infinite; }
        .anim-float-delay { animation: float-cute 4s ease-in-out infinite; animation-delay: 1.5s; }
        .anim-sway { animation: sway-cute 5s ease-in-out infinite; transform-origin: bottom center; }
        .anim-blink { transform-origin: 50% 45%; animation: blink-eyes 5s infinite; }
        .anim-pop { animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .svg-accent { color: var(--color-peach); }
        .svg-highlight { color: var(--color-sky); }

        /* Glassmorphism & Card Styles - ปรับให้กระจกใสและสะท้อนแสงมากขึ้น */
        .glass-card {
            background: linear-gradient(135deg, rgba(246, 255, 234, 0.6) 0%, rgba(246, 255, 234, 0.1) 100%); /* เปลี่ยนสีขาวเป็น Honeydew */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 222, 150, 0.5); /* Soft peach border */
            border-top: 1px solid rgba(246, 255, 234, 0.9);
            border-left: 1px solid rgba(246, 255, 234, 0.9);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(201, 54, 56, 0.05), inset 0 2px 5px rgba(246, 255, 234, 0.7); /* ใช้ Tomato jam เป็นเงาแทนสีดำ */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* เอฟเฟกต์แสงสะท้อนวิ่งผ่านการ์ด (Shine Reflection) */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(246,255,234,0) 0%, rgba(246,255,234,0.6) 50%, rgba(246,255,234,0) 100%);
            transform: skewX(-25deg);
            transition: all 0.5s ease;
            z-index: 1;
            pointer-events: none;
        }

        .glass-card:hover::before {
            animation: shine 1.5s;
        }

        @keyframes shine {
            100% { left: 200%; }
        }

        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(201, 54, 56, 0.08), inset 0 2px 5px rgba(246, 255, 234, 1);
        }

        /* Glossy Button */
        .btn-glossy {
            background: linear-gradient(135deg, var(--color-coral) 0%, var(--color-peach) 100%);
            color: var(--bg-main); /* Honeydew text */
            border-radius: 1rem;
            box-shadow: 0 6px 20px rgba(250, 133, 90, 0.4), inset 0 2px 5px rgba(246, 255, 234, 0.6);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-glossy::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(246, 255, 234, 0.3);
            transform: rotate(45deg);
            transition: all 0.3s ease;
            opacity: 0;
        }

        .btn-glossy:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(250, 133, 90, 0.6), inset 0 2px 5px rgba(255,255,255,0.5);
        }
        
        .btn-glossy:hover::after {
            opacity: 1;
            left: 100%;
        }

        /* Sidebar Active State */
        .nav-item {
            transition: all 0.3s ease;
            border-radius: 1rem;
        }
        .nav-item:hover {
            background-color: rgba(98, 196, 218, 0.1); /* Sky blue low opacity */
        }
        .nav-item.active {
            background: linear-gradient(135deg, var(--color-sky) 0%, var(--color-peach) 100%);
            color: var(--bg-main) !important;
            box-shadow: 0 4px 15px rgba(98, 196, 218, 0.4);
        }
        .nav-item.active i {
            color: var(--bg-main) !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-peach);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-coral);
        }

        /* Progress Bar Animations */
        .progress-bar {
            transition: width 1s ease-in-out;
        }

        /* Modal Overlay */
        .modal-overlay {
            background: rgba(201, 54, 56, 0.1); /* Tomato Jam เบลอๆ แทนสีดำ */
            backdrop-filter: blur(5px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        /* Input Glass Styles - ปรับช่องกรอกข้อมูลให้มีความแวววาวและไม่มีสีขาว/ดำ */
        input[type="text"], input[type="number"], input[type="date"], input[type="month"], select {
            background: rgba(246, 255, 234, 0.5) !important;
            border: 1px solid rgba(255, 222, 150, 0.8) !important;
            box-shadow: inset 0 2px 4px rgba(201, 54, 56, 0.03) !important;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            color: var(--color-tomato) !important;
        }
        input:focus, select:focus {
            background: rgba(246, 255, 234, 0.8) !important;
            border-color: var(--color-sky) !important;
            box-shadow: 0 0 0 3px rgba(98, 196, 218, 0.3) !important;
            outline: none;
        }

        /* Layout utilities */
        .main-content {
            transition: margin-left 0.3s ease;
        }
        
        /* Table Styles - ปรับให้ตอนชี้เมาส์แถวตารางดูลอยและใสขึ้น */
        th {
            background-color: rgba(250, 133, 90, 0.15);
            color: var(--color-coral);
            font-weight: 600;
            backdrop-filter: blur(4px);
        }
        tr {
            transition: all 0.2s ease;
        }
        tr:hover {
            background-color: rgba(246, 255, 234, 0.6); /* Honeydew hover */
            transform: scale(1.005);
            box-shadow: 0 2px 10px rgba(201, 54, 56, 0.02); /* Tomato Jam shadow */
        }

        /* iOS Input Zoom Fix */
        @media screen and (max-width: 767px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }
    </style>
</head>
